name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        # JIT is disabled in CI: the hosted runners ship an LLVM that CMake can
        # find but whose ORC JIT cannot initialize there, so the DSL test/examples
        # are excluded. The core library, examples, and the rest of the tests run.
        # (The JIT path is exercised locally where LLVM hosts a working JIT.)
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DPRICER_ENABLE_JIT=OFF

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

  python:
    name: python (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package (builds the C++ extension)
        run: python -m pip install .
      - name: Run Python tests
        # Run from a neutral directory so the installed package is imported,
        # not the source tree.
        run: cd "${{ runner.temp }}" && python "${{ github.workspace }}/python/tests/test_pricer.py"

  server:
    name: server (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the REST server
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DPRICER_BUILD_SERVER=ON \
            -DPRICER_BUILD_EXAMPLES=OFF -DPRICER_BUILD_TESTS=OFF -DPRICER_ENABLE_JIT=OFF
          cmake --build build --parallel
      - name: Smoke-test the endpoints
        run: python server/smoke_test.py build/server/pricer_server 8137

  docker:
    name: docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the server image
        run: docker build -t pricer-server:ci .
      - name: Run the container and check endpoints (incl. /metrics)
        run: |
          docker run -d --rm -p 8080:8080 --name pricer_ci pricer-server:ci
          for _ in $(seq 1 30); do
            curl -sf http://127.0.0.1:8080/health && break || sleep 1
          done
          curl -sf 'http://127.0.0.1:8080/price?type=call&S=100&K=100&r=0.05&sigma=0.2&T=1'
          curl -sf http://127.0.0.1:8080/metrics | grep -q pricer_requests_total
          docker stop pricer_ci
