name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        # JIT is disabled in CI: the hosted runners ship an LLVM that CMake can
        # find but whose ORC JIT cannot initialize there, so the DSL test/examples
        # are excluded. The core library, examples, and the rest of the tests run.
        # (The JIT path is exercised locally where LLVM hosts a working JIT.)
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DPRICER_ENABLE_JIT=OFF

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure
