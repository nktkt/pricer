# Deployment for the pricer REST service.
# The server is stateless (each request is independent; async MC jobs live in
# memory per pod), so it scales horizontally — run several replicas behind the
# Service and let the HorizontalPodAutoscaler add more under load.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pricer-server
  labels:
    app: pricer-server
spec:
  replicas: 2
  selector:
    matchLabels:
      app: pricer-server
  template:
    metadata:
      labels:
        app: pricer-server
      annotations:
        # Let a Prometheus scraper discover the /metrics endpoint on each pod.
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001          # matches the 'pricer' user baked into the image
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: pricer-server
          image: pricer-server:latest
          imagePullPolicy: IfNotPresent   # use a locally built/loaded image if present
          args: ["8080"]                  # the server takes the listen port as argv[1]
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: "100m"                 # a CPU request is required for the HPA's CPU target
              memory: "32Mi"
            limits:
              cpu: "1"
              memory: "128Mi"
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true  # the server writes only to stderr (logs)
            capabilities:
              drop: ["ALL"]
